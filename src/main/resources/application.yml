server:
  port: 8090

spring:
  application:
    name: nexus-mcp-sidecar

sidecar:
  # --------------------------------------------------------------------------------------------
  # DEVELOPMENT VALUES. Production supplies all of these as environment variables.
  #
  # Deployment shape: master and this gateway sit behind the SAME existing reverse proxy, on one
  # external origin, split by path:
  #
  #   https://blss.<deployment>/mcp                                  -> this gateway
  #   https://blss.<deployment>/.well-known/oauth-protected-resource -> this gateway
  #   https://blss.<deployment>/.well-known/oauth-authorization-server -> master
  #   https://blss.<deployment>/.well-known/jwks.json                -> master
  #   everything else (/rest/** ...)                                 -> master
  #
  # The two /.well-known documents belong to DIFFERENT services; routing them to the same one is
  # the easiest way to get a blanket 401 with no other diagnostic.
  #
  # Production, once the domain is fixed:
  #   SIDECAR_ISSUER_URI   = https://blss.<deployment>
  #   SIDECAR_MCP_RESOURCE = https://blss.<deployment>/mcp
  #   BLSS_MCP_URL         = http://127.0.0.1:<master-port>/mcp   (loopback; never the public origin)
  #
  # These must match master's mcp.oauth2.issuer / mcp.oauth2.mcp-resource exactly.
  # This gateway's own listen port is internal only - the reverse proxy is the public surface.
  # --------------------------------------------------------------------------------------------

  # External Authorization Server (master) issuer. Used to discover the jwks_uri (when jwks-uri is
  # blank), to validate the `iss` claim of incoming MCP_ACCESS_TOKENs, and to advertise
  # `authorization_servers` in the protected-resource metadata.
  issuer-uri: ${SIDECAR_ISSUER_URI:https://vdchost-server}
  # Optional explicit JWKS endpoint of the external AS. Blank = discover from issuer-uri metadata.
  jwks-uri: ${SIDECAR_JWKS_URI:}
  # The MCP resource identifier (RFC 8707) this gateway represents. Incoming tokens MUST carry it in
  # `aud`; also published as `resource` in the protected-resource metadata. Per the MCP spec this is
  # the canonical URI of the MCP server, so carrying the /mcp path is correct and preferred.
  mcp-resource: ${SIDECAR_MCP_RESOURCE:https://vdchost-server/mcp}
  # Allowed clock skew when validating exp/nbf on incoming access tokens.
  clock-skew: ${SIDECAR_CLOCK_SKEW:60s}

  # DEV/INTEGRATION ONLY. Skip TLS certificate + hostname verification on outbound calls to master
  # (JWKS/metadata discovery and On-Behalf-Of backend calls), so a self-signed master cert is
  # accepted without a truststore. Defaulted to true for the current E2E bring-up against master's
  # self-signed cert. MUST be set back to false for production; the dedicated mTLS work will replace
  # this with certificate pinning and lifecycle management.
  insecure-skip-tls-verify: ${SIDECAR_INSECURE_SKIP_TLS_VERIFY:true}

  # Static registry of backend MCP servers (D13). BLSS MCP is the first and only MVP backend;
  # Superset is deferred until its authentication and user-mapping contract is confirmed.
  # Prefixes must be unique, match [a-zA-Z0-9_-]+ and contain no '__'; URLs must be absolute.
  # Invalid entries fail startup; an unreachable backend does not, because discovery is lazy.
  backends:
    - prefix: blss
      url: ${BLSS_MCP_URL:https://vdchost-server/mcp}

  # Catalog freshness threshold (request-driven, not a background schedule) and the delay before a
  # failed discovery/refresh is retried.
  catalog-ttl: ${SIDECAR_CATALOG_TTL:10m}
  catalog-failure-backoff: ${SIDECAR_CATALOG_FAILURE_BACKOFF:30s}
  # Bound outbound backend MCP calls so a slow/hung backend fails fast instead of stalling the call.
  backend-connect-timeout: ${SIDECAR_BACKEND_CONNECT_TIMEOUT:5s}
  backend-read-timeout: ${SIDECAR_BACKEND_READ_TIMEOUT:15s}

# Diagnostic logging: written to ./sidecar.log so the server-side view of the OAuth + MCP requests
# is readable regardless of how the app is started.
logging:
  file:
    name: sidecar.log
  level:
    org.springframework.security.web: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.optimumpathinc.nexus.mcp.gateway: DEBUG
